const FAKE_NAMES=['김민수','이지은','박준호','최서연','정하준','한지민'];
function convert(type, v, method, i=0){
  if(method==='삭제') return '';
  if(method==='태그') return type==='프로젝트 코드명' ? `[프로젝트${String.fromCharCode(65+i)}]` : `[${type}${String.fromCharCode(65+i)}]`;
  if(method==='일반화'){
    if(type==='주소') return v.split(/\s+/).slice(0,2).join(' ');
    if(type==='나이'){const n=parseInt(v);return isNaN(n)?'(연령대)':`${Math.floor(n/10)*10}대`}
    if(type==='생년월일'){const y=(v.match(/\d{4}/)||[''])[0];return y?`${y.slice(0,3)}0년대`:'(연대)'}
    return `(${type})`;
  }
  if(type==='이름') return FAKE_NAMES[i%FAKE_NAMES.length];
  if(type==='전화번호') return `010-0000-${String(i+1).padStart(4,'0')}`;
  if(type==='이메일') return `user${i+1}@example.com`;
  if(type==='고객ID') return `CU-${100001+i}`;
  if(type==='계좌번호') return v.replace(/\d/g,'0');
  if(type==='주소') return '서울 중구 세종대로 1';
  if(type==='프로젝트 코드명') return ['프로젝트 은하','프로젝트 바다','프로젝트 숲'][i%3];
  const d=v.replace(/\d/g,'0'); return d===v?'○○○':d;
}
// 보안팀 화면에서는 원래 값을 일부만 보여준다
function partial(type,v){
  if(v==null||v==='') return '—';
  if(typeof v==='string'&&v.startsWith('⟦')) return v; // 서버 데이터: 값은 저장하지 않음
  if(type==='이름') return v[0]+'*'.repeat(Math.max(1,v.length-2))+(v.length>2?v.slice(-1):'');
  if(type==='주소') return v.split(/\s+/).slice(0,2).join(' ')+' ***';
  if(type==='전화번호') return v.replace(/(\d{2,3})-?(\d{3,4})-?(\d{4})/,'$1-****-$3');
  if(type==='이메일') return v.replace(/^(.).*@/,'$1***@');
  if(type==='주민등록번호') return '******-*******';
  if(['카드번호','계좌번호'].includes(type)) return v.slice(0,4)+'****';
  if(type==='생년월일') return v.replace(/\d+월 \d+일/,'**월 **일');
  return v;
}
function josa(w,a,b){const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+a;return w+((c-0xAC00)%28?a:b)}

  {tpl:'{0}({1}, 고객번호 {2}) 환불 건 처리 순서 정리해줘', items:[['이름','김도현'],['이메일','dohyun.kim@gmail.com'],['고객ID','CU-882910']]},

  {tpl:'{0} 일정이 2주 밀렸어요. 협력사에 보낼 지연 안내 메일 써줘', items:[['프로젝트 코드명','프로젝트 오로라']]},
  {tpl:'{0} {1} 님 4대보험 취득 신고서 작성 순서 알려줘', items:[['주민등록번호','880512-1234567'],['이름','윤정아']]},
  {tpl:'거래처 담당 {0} 님 계좌 {1}로 이체 요청 메일 써줘', items:[['이름','이영희'],['계좌번호','국민 123456-01-234567']]},
  {tpl:'{0}({1}) 학생 상담 기록 요약해줘. 보호자 연락처 {2}', items:[['이름','최하린'],['나이','17세'],['전화번호','010-8877-1234']]},

  {tpl:'Authorization: Bearer {0} 넣었는데 왜 401 나와?', items:[['API 키','sk-live-9fA2x7Qp1LmZ0bN4']]},
  {tpl:'{0} 412억 기준으로 IR 자료 요약해줘', items:[['미공개 실적','3분기 매출']]},
  {tpl:'회의록 템플릿 마크다운으로 만들어줘', items:[]},

const FILES = [['고객명단_11월.xlsx',['작성자','숨긴 시트·행','메모·주석']],['인사평가_초안.docx',['작성자','변경 내용 추적']],['현장사진_0412.jpg',['사진 위치(EXIF)']],['계약서_스캔.pdf',['작성자','문서 속성(회사명 등)']]];

function rnd(seed){let s=seed;return()=>((s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5|0,(s>>>0)%100000)/100000)}
const R = rnd(11);
const pick = a => a[Math.floor(R()*a.length)];
const EVENTS = [];
for(let i=0;i<380;i++){
  const s=pick(SAMPLES); let u=pick(USERS);
  const t=new Date(NOW-Math.floor(Math.pow(R(),1.1)*21*24*60)*60000), age=(NOW-t)/864e5;
  const grade = s.items.some(([x])=>ent(x).grade==='C')?'C':s.items.length?'S':'O';
  const ti={};
  const items=s.items.map(([type,orig])=>{const e=ent(type),k=ti[type]=(ti[type]??-1)+1;
    return {type,orig,method:e.method,conv:e.grade==='S'?convert(type,orig,e.method,k):null,status:grade==='S'?'conv':null,reason:null,fp:null}});
  let action = grade==='C'?'block':grade==='O'?'pass':null;
  if(grade==='S'){
    // 자동 변환이 쌓이며 원문 전송은 줄어드는 추세
    const r=R(), pr=.06+.08*(age/21);
    action = r<pr?'raw':r<pr+.23?'revert':r<pr+.31?'cancel':'sent';
    if(action==='raw'){ items.forEach(it=>it.status='raw'); if(R()<.3) u=USERS[pick([1,8,12])]; }
    if(action==='revert'){
      items.forEach(it=>{ if(R()<(REV_W[it.type]||.1)*1.6) it.status='revert' });
      if(!items.some(it=>it.status==='revert')) items.reduce((a,b)=>(REV_W[b.type]||0)>(REV_W[a.type]||0)?b:a).status='revert';
      items.filter(it=>it.status==='revert').forEach(it=>{ it.reason=R()<(FP_P[it.type]??.3)?'오탐':'업무상 필요'; if(it.reason==='오탐') it.fp='open'; });
    }
  }
  const f = R()<.2&&grade==='S' ? pick(FILES) : null;
  EVENTS.push({id:String(25060-i), time:t, user:u[0], dept:u[1], ai:pick(AI), file:f?{name:f[0],meta:f[1]}:null,
    tpl:s.tpl, items, grade, action, conf:+(0.93+R()*.06).toFixed(2), ver:t<new Date('2026-10-28T14:02')?'v11':'v12'});
}
EVENTS.sort((a,b)=>b.time-a.time);
// 데모: 최근 민감 건 하나는 주민등록번호 원문 전송
{const e=EVENTS.find(e=>e.grade==='S'&&NOW-e.time>3*36e5);const sm=SAMPLES[4];
 Object.assign(e,{tpl:sm.tpl,action:'raw',file:null,items:sm.items.map(([type,orig])=>({type,orig,method:ent(type).method,conv:convert(type,orig,ent(type).method),status:'raw',reason:null,fp:null}))});}
EVENTS.filter(e=>NOW-e.time>10*864e5).forEach(e=>e.items.forEach(it=>{if(it.fp==='open'&&R()<.6)it.fp=pick(['exclude','keep'])}));

  '변환본으로 보내면 거래처가 내용을 못 알아봐서 원문으로 보냈습니다. 사유 입력은 깜빡했습니다.',
];
const NEED_REASON = {'주민등록번호':'4대보험 신고서 양식이 맞는지 확인하려면 실제 번호 형식이 필요했습니다.','계좌번호':'거래처 이체 요청 메일이라 실제 계좌번호가 들어가야 했습니다.','프로젝트 코드명':'협력사에 보내는 메일이라 실제 프로젝트명이 필요했습니다.','주소':'배송지 변경 안내라 정확한 주소가 필요했습니다.','고객ID':'고객 시스템에서 조회할 실제 고객번호가 필요했습니다.','생년월일':'지원 자격(연령) 확인에 실제 생년월일이 필요했습니다.','이름':'고객에게 바로 보낼 안내문이라 실제 이름이 필요했습니다.'};

  id:'INC-'+e.id, ev:e, need:e.action==='raw'?'req':'opt', time:e.time, user:e.user, dept:e.dept, items:e.items, file:e.file,

CASES.forEach(c=>{
  const age=(NOW-c.time)/864e5;
  if(c.need==='opt'){
    const it=c.items.find(i=>i.reason==='업무상 필요');

      +(SEL==='req'&&wait.length?`<div class="nx-h">사유 대기 ${wait.length}</div>`+wait.map(c=>`<div class="nx dim"><b>${c.user}</b><span>${types(c)} → ${c.ev.ai}</span>${API.live?'':`<button class="btn sm ghost" data-q="demo" data-id="${c.id}">사유 도착시키기 · 데모</button>`}</div>`).join(''):'');
  }else if(SEL==='fp'){
    const sent=g=>{const r=g.refs[0];return esc(r.e.tpl.replace(/\{(\d)\}/g,(_,j)=>r.e.items[j]===r.it?'⟪'+partial(g.type,r.it.orig)+'⟫':'…'))};
    BIG=cur?`<div class="nc-who"><b>${esc(partial(cur.type,cur.value))}</b><span class="sub">${cur.type} · 신고 ${cur.refs.length}회</span></div>
      <div class="nc-x">${sent(cur)}</div>
      <div class="nc-a"><button class="btn dbtn" data-q="keep" data-g="${ci}" aria-keyshortcuts="1"><span>탐지 결과 유지</span><small>실제 개인정보가 맞아요</small><kbd>1</kbd></button><button class="btn dbtn" data-q="exclude" data-g="${ci}" aria-keyshortcuts="2"><span>탐지 제외 검토</span><small>이 값만 앞으로 안 잡도록 정책 초안에 추가</small><kbd>2</kbd></button><div class="kbd-hint">1·2 판단 · ↑↓ 다른 값 · Z 되돌리기</div></div>`
      :'<div class="empty"><b>처리할 신고가 없어요</b></div>';
    NEXT=Q.map((g,i)=>g===cur?'':`<button class="nx" data-pick="${keyOf(g)}"><b>${esc(partial(g.type,g.value))}</b><span>${g.type}</span><em>${g.refs.length}회</em></button>`).join('');
  }else{
    BIG=eff?`<div class="nc-big">원문 전송 ${raw} → ${raw-caught}</div><div class="nc-who"><span class="sub">${LASTPUB} 배포 · 지난 7일에 이 규칙이 있었다면</span></div>
        <div class="nc-a"><button class="btn p" data-q="next">다음 할 일</button></div>`
      :P.changes.length?`<div class="qlist">${P.changes.map(c=>`<div class="chg">${esc(c.what)}</div>`).join('')}</div><div class="nc-a"><button class="btn p" id="pubBtn">서명 후 배포</button></div>`
      :`<div class="empty"><b>배포할 변경이 없어요</b><span class="sub">${P.version} 적용 중</span></div>`;
    NEXT=P.learned.slice().reverse().map(r=>`<div class="nx static"><b>${r.type}</b><span>${esc(r.when)} → ${r.method}</span><em>${r.live?'적용 중':'배포 대기'}</em></div>`).join('');
  }

  // 지금 보는 건이 거쳐 온 단계와 앞으로 갈 단계
  const ST=!cur&&SEL!=='pol'?null:{
    req:[['원문 전송','done'],['사유 도착','done'],['판단','now'],['규칙 배포','next','예외 인정일 때'],['PC 적용','next']],
    opt:[['되돌림','done','업무상 필요'],['사유 남김','done'],['확인','now'],['종결','next']],
    fp:[['오탐으로 되돌림','done',`${cur&&cur.refs?cur.refs.length:0}회`],['판단','now'],['배포','next','제외할 때'],['PC 적용','next']],
    pol:eff?[['판단','done'],['규칙 생성','done'],['서명 후 배포','done',LASTPUB],['PC 적용','now','5분 안에 받아요']]
      :P.changes.length?[['판단','done'],['규칙 생성','done',`${P.changes.length}건`],['서명 후 배포','now'],['PC 적용','next']]
      :[['서명 후 배포','done',P.version],['PC 적용','done']],
  }[SEL];
  const STEPBAR=ST?`<ol class="stp" aria-label="이 건의 단계">${ST.map(([t,s,sub])=>`<li class="${s}"${s==='now'?' aria-current="step"':''}><span class="d">${s==='done'?'✓':''}</span><span class="t">${t}</span>${sub?`<em>${sub}</em>`:''}</li>`).join('')}</ol>`:'';
  $('#view').innerHTML=`
  <section class="card board tray-board">
    <div class="bd-vp" id="vp"><div class="stage" id="stage" style="width:${SW}px;height:${SH}px">
      <svg aria-hidden="true" style="width:${SW}px;height:${SH}px">${EG.map(e=>`<path class="bedge ${e.c}" d="${rpath(e.p)}"/>`).join('')}</svg>
      ${CH.map(c=>`<span class="bchip ${c.cls||''}" style="left:${c.x}px;top:${c.y}px">${c.t}</span>`).join('')}
      ${N.map(node).join('')}
    </div>
    <div class="zoom"><button class="btn sm ghost" data-z="1" aria-label="확대">+</button><button class="btn sm ghost" data-z="0">맞춤</button><button class="btn sm ghost" data-z="-1" aria-label="축소">−</button></div></div>
    <svg class="bwire" id="bwire" aria-hidden="true"><path id="bwp"/><circle id="bwa" r="0"/></svg>
    <div class="tray" id="tray">
      <span class="tail" id="tab" style="left:${TAILX}px"></span>
      <div class="tray-in">
        <section class="nowc" aria-label="지금 한 건">
          <div class="nc-h"><h2 class="h20">${TITLE}</h2>${prog}${TA}</div>
          ${STEPBAR}
          <div class="nc-b" id="ncb">${BIG}</div>
        </section>
        <aside class="nexts" aria-label="다음">${NEXT?`<div class="nx-h">${SEL==='pol'?'규칙':'다음'}</div>${NEXT}`:''}</aside>
      </div>
    </div>
  </section>`;

  // ── 확대·이동 + 노드 아래에서 트레이 꼬리로 내려오는 선
  const vp=$('#vp'), stg=$('#stage'), bd=$('.tray-board'), tab=$('#tab'), tray=$('#tray');
  const off=()=>{$('#bwp').setAttribute('d','');$('#bwa').setAttribute('r',0)};
  const placeTab=()=>{const el=stg.querySelector('.wn.sel');if(!el)return;const b=tray.getBoundingClientRect(),r=el.getBoundingClientRect();
    const first=!TAILSET;if(first)tab.style.transition='none';
    TAILX=Math.min(Math.max(r.left+r.width/2-b.left,40),b.width-40);tab.style.left=TAILX+'px';
    if(first){tab.getBoundingClientRect();tab.style.transition='';TAILSET=true}};
  const wire=()=>{const el=stg.querySelector('.wn.sel');if(!el)return off();
    const b=bd.getBoundingClientRect(),r=el.getBoundingClientRect(),v=vp.getBoundingClientRect(),t=tab.getBoundingClientRect();
    if(r.bottom<v.top||r.top>v.bottom||r.right<v.left||r.left>v.right)return off();
    const x1=r.left+r.width/2-b.left,y1=Math.min(r.bottom,v.bottom)-b.top,x2=t.left+t.width/2-b.left,y2=t.top+t.height/2-b.top;
    const mid=(y1+y2)/2;$('#bwp').setAttribute('d',Math.abs(x1-x2)<4?`M${x1},${y1} V${y2}`:rpath([[x1,y1],[x1,mid],[x2,mid],[x2,y2]],12));
    $('#bwa').setAttribute('cx',x1);$('#bwa').setAttribute('cy',y1);$('#bwa').setAttribute('r',5)};
  tab.addEventListener('transitionend',()=>wire());
  let raf=0;const follow=ms=>{const t0=performance.now();cancelAnimationFrame(raf);const f=()=>{wire();if(performance.now()-t0<ms)raf=requestAnimationFrame(f)};f()};
  const apply=(v,anim)=>{stg.classList.toggle('anim',!!anim);stg.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.s})`;VIEW=v;placeTab();follow(500)};  // 꼬리가 미끄러지는 0.45초 동안 선도 따라 그린다
  // 오른쪽 64px는 줌 버튼 자리로 비워 둔다
  const fit=anim=>{const w=vp.clientWidth-64,h=vp.clientHeight,s=Math.min(1.1,Math.max(.4,Math.min((w-32)/SW,(h-40)/SH)));apply({s,x:Math.max(16,(w-SW*s)/2),y:Math.max(8,(h-SH*s)/2)},anim)};
  // 꼬리는 이전 자리에서 새 자리로 미끄러지듯 이동
  if(home._tabX!=null){tab.style.transition='none';tab.style.left=home._tabX+'px'}
  if(VIEW&&VIEW.keep) apply(VIEW); else fit();
  if(home._tabX!=null){const to=tab.style.left;tab.style.left=home._tabX+'px';void tab.offsetWidth;tab.style.transition='';tab.style.left=to;follow(500)}
  home._tabX=parseFloat(tab.style.left)||0;
  window.onresize=()=>{if(document.body.contains(vp))fit()};
  const zoomAt=(ns,mx,my)=>{ns=Math.min(2,Math.max(.35,ns));apply({s:ns,x:mx-(mx-VIEW.x)*ns/VIEW.s,y:my-(my-VIEW.y)*ns/VIEW.s,keep:1})};
  vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoomAt(VIEW.s*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),e.clientX-r.left,e.clientY-r.top)},{passive:false});
  $$('[data-z]').forEach(b=>b.onclick=()=>{const z=+b.dataset.z;if(!z){VIEW=null;fit(true);return}zoomAt(VIEW.s*(z>0?1.2:1/1.2),vp.clientWidth/2,vp.clientHeight/2)});
  let drag=null;
  vp.onpointerdown=e=>{if(e.target.closest('button,a'))return;drag={x:e.clientX,y:e.clientY,v:VIEW};vp.setPointerCapture(e.pointerId);vp.classList.add('grab')};
  vp.onpointermove=e=>{if(!drag)return;apply({s:drag.v.s,x:drag.v.x+e.clientX-drag.x,y:drag.v.y+e.clientY-drag.y,keep:1})};
  vp.onpointerup=vp.onpointercancel=()=>{drag=null;vp.classList.remove('grab')};

  // ── 처리 (한 번 클릭 + 되돌리기). 처리하면 다음 건, 대기열이 끝나면 다음 할 일 노드로
  $$('[data-sel]').forEach(b=>b.onclick=()=>{SEL=b.dataset.sel;home()});
  $$('[data-pick]').forEach(b=>b.onclick=()=>{CUR[SEL]=b.dataset.pick;home()});
  const NAME={violation:'위반',legit:'예외 인정',legit0:'문제 없음',fp:'오탐'};
  const done=()=>{const nb=$('#ncb');if(nb)nb.classList.add('out');setTimeout(()=>{ADV=true;home();badges()},nb?200:0)};
  $$('[data-q]').forEach(b=>b.onclick=()=>{const q=b.dataset.q,c=b.dataset.id&&caseById(b.dataset.id);
    if(q==='next'){LASTPUB=null;ADV=true;home();return}
    if(q==='demo'){c.reason={text:pick(LATE_REASON),at:clock(),when:'요청 받고 제출'};c.timeline.push({t:clock(),who:c.user,cls:'emp',what:'사유 제출',quote:c.reason.text});home();badges();return}
    if(q==='keep'||q==='exclude'){const g=fps[+b.dataset.g];
      if(q==='keep'){g.refs.forEach(r=>r.it.fp='keep');undoToast(`${partial(g.type,g.value)} 정탐 유지`,()=>g.refs.forEach(r=>r.it.fp='open'));done()}
      else excludeModal(g,done);return}
    if(c){const nL=P.learned.length,nC=P.changes.length,k=q==='legit0'?'legit':q;
      if(q==='legit0'){closeCase(c,{k:'legit',cause:null,memo:'사유 확인',rule:null})}else quickClose(c,k,true);
      done();
      undoToast(`${c.user} · ${NAME[q]}${P.learned.length>nL?' · 규칙 추가돼 배포 대기':''}`,()=>{c.status='open';c.close=null;P.learned.length=nL;P.changes.length=nC;CUR[SEL]=c.id;SEL=c.need==='opt'?'opt':'req'})}
  });
  const all=$('#allOk');if(all)all.onclick=()=>{const list=[...opt];list.forEach(c=>closeCase(c,{k:'legit',cause:null,memo:'사유 확인',rule:null}));ADV=true;home();badges();
    undoToast(`선택 검토 ${list.length}건 문제 없음`,()=>{list.forEach(c=>{c.status='open';c.close=null});SEL='opt'})};
  const pb=$('#pubBtn');if(pb)pb.onclick=()=>publishModal(()=>{LASTPUB=POLICY.version;home()});
  guideSpot();
}

// ═══════════ 2. 위반 검토 ═══════════
let rq={tab:'req', q:''}, picked=new Set();
const TABS={
  req:['필수','<b>원문을 그대로 보내면서 사유 선택을 건너뛴 건</b>이에요(탐지가 확실한 건만). 시스템이 직원에게 사유 제출을 요청했어요. 모두 결론을 내 주세요.'],
  opt:['선택','직원이 미리보기에서 <b>일부 항목을 되돌리고 "업무상 필요"를 고른 건</b>이에요. 사유가 이미 있어요. 필요할 때 확인하세요.'],
  closed:['종결','결론이 난 사건이에요. 직원 사유와 보안팀 판단 근거가 함께 남아요.'],
};
function listOf(tab){
  return CASES.filter(c=>tab==='closed'?c.status==='closed':c.need===tab&&c.status==='open')
    .filter(c=>!rq.q||(c.id+c.user+c.dept+c.items.map(i=>i.type).join()).includes(rq.q))
    .sort(tab==='closed'?(a,b)=>b.close.at-a.close.at:tab==='req'?(a,b)=>(!!b.reason-!!a.reason)||b.time-a.time:(a,b)=>b.time-a.time);
}
function review(id){
  if(id){const c=caseById(id);if(c)rq.tab=c.status==='closed'?'closed':c.need}
  const list=listOf(rq.tab), wide=innerWidth>1100;
  if(!id&&wide&&list[0]) id=list[0].id;
  const c=id&&caseById(id);
  const n=k=>k==='closed'?CASES.filter(c=>c.status==='closed').length:openOf(k).length;
  const row=x=>{
    const sel=rq.tab==='opt';
    const line = x.status==='closed' ? `<span class="pill ${x.close.k==='violation'?'bad':x.close.k==='fp'?'info':'mute'}">${CONCLUSION[x.close.k][0]}</span> <span class="sub">${x.reason?'· "'+esc(x.reason.text)+'"':'· 사유 미제출'}</span>`
      : x.reason ? `<b>${x.reason.pick?'업무상 필요':'사유 도착'}</b> · ${esc(x.reason.text)}` : `<span class="wait">사유 대기 중</span>`;
    return `<a class="it ${c&&x.id===c.id?'on':''}" href="#review/${x.id}">
      <div class="a">${sel?`<input type="checkbox" class="chk" data-pick="${x.id}" ${picked.has(x.id)?'checked':''} aria-label="${x.id} 선택">`:''}<span class="who">${x.user}</span><span class="sub">${x.dept}</span><span class="when">${ago(x.time)}</span></div>
      <div class="types">${typeTags(x.items.filter(i=>i.status!=='conv'))}</div>
      <div class="r">${line}</div></a>`;
  };
  $('#view').innerHTML=`
  <div class="split ${c?'has':''}">
    <section class="card listpane" aria-label="사건 목록">
      <div class="card-h" style="flex-direction:column;align-items:flex-start;gap:24px"><h1 class="t32">위반 검토</h1>
        <div class="tabs" id="tabs" role="tablist">${Object.entries(TABS).map(([k,[t]])=>`<button role="tab" data-k="${k}" class="${rq.tab===k?'on':''}">${t}<span class="n ${k==='req'?'hot':''}">${n(k)}</span></button>`).join('')}</div></div>
      <div class="card-b">
        ${rq.tab==='opt'?`<div class="toolbar"><span class="sub">체크해서 한 번에 종결해요</span><button class="btn sm" id="bulk" ${picked.size?'':'disabled'}>${picked.size?picked.size+'건 ':''}종결하기</button></div>`:''}
        <div class="list">${list.length?(rq.tab==='req'?groupRows(list,row):list.map(row).join('')):`<div class="empty"><b>${rq.tab==='closed'?'종결된 사건이 없어요':'검토할 사건이 없어요'}</b><span class="sub">다른 탭을 확인해 보세요</span></div>`}</div>
      </div>
    </section>
    <section class="card detailpane" aria-label="사건 상세">${c?detail(c):'<div class="empty"><b>사건을 고르세요</b><span class="sub">왼쪽 목록에서 사건을 누르면 여기에 열려요</span></div>'}</section>
  </div>`;
  $('#tabs').onclick=e=>{const k=e.target.closest('button')?.dataset.k;if(!k)return;rq.tab=k;picked.clear();if(location.hash==='#review')review();else location.hash='review'};
  let tm;if($('#q'))$('#q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{rq.q=e.target.value;review(c&&c.id);const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)},250)};
  $$('[data-pick]').forEach(x=>{x.onclick=e=>e.stopPropagation();x.onchange=()=>{x.checked?picked.add(x.dataset.pick):picked.delete(x.dataset.pick);review(c&&c.id)}});
  const bulk=$('#bulk');if(bulk)bulk.onclick=()=>openModal({title:`선택 검토 ${picked.size}건 — 문제 없음`,
    html:`<p>정당한 업무 사용으로 종결해요.</p><label class="f">판단 근거</label><textarea name="memo">사유 확인 — 업무 범위 내 사용</textarea>`,
    ok:'종결하기',onOk:f=>{const k=picked.size;[...picked].forEach(id=>closeCase(caseById(id),{k:'legit',cause:null,memo:f.memo,rule:null}));picked.clear();toast(`${k}건을 종결했어요`);review()}});
  if(c) bindDetail(c);
}

function groupRows(list,row){
  const ready=list.filter(x=>x.reason), wait=list.filter(x=>!x.reason);
  const h=(t,n)=>`<div class="lh"><b>${t}</b><span class="n">${n}</span></div>`;
  return (ready.length?h('사유 도착 · 지금 결론',ready.length)+ready.map(row).join(''):'')
       + (wait.length?h('사유 기다리는 중',wait.length)+wait.map(row).join(''):'');
}
function detail(c){
  const leaked=c.items.filter(i=>i.status!=='conv');
  const st=c.status==='closed'?`<span class="pill ${c.close.k==='violation'?'bad':c.close.k==='legit'?'ok':''}">${CONCLUSION[c.close.k][0]}</span>`:c.reason?'<span class="pill br">검토 대기</span>':'<span class="pill">사유 대기</span>';
  return `
  <div class="dhead">
    <div style="min-width:0">
      <a class="btn sm ghost back" href="#review" style="margin:-8px 0 8px -16px">목록으로</a>
      <div class="badges">${needPill(c)}${st}</div>
      <h2 class="t24">${c.user} 님이 ${leaked.map(i=>i.type).join(', ')} 원문을 ${c.ev.ai}에 보냈어요</h2>
      <div class="sub">${c.dept} · ${ago(c.time)}</div>
    </div>
    <div class="actbar">${actions(c)}</div>
  </div>
  <div class="dbody">
  ${reasonSec(c)}
  ${c.close?closeSec(c):''}
  <div class="dsec"><h3>사건 경로</h3>${casePath(c)}</div>
  <div class="dsec"><h3>보낸 내용 <span class="sub">원문은 일부만 보여요</span></h3>
    <div class="text">${sentHtml(c)}</div>
    ${c.items.some(i=>i.reason==='오탐')?`<div class="note mt"><div>${c.items.filter(i=>i.reason==='오탐').map(i=>i.type).join(', ')} 항목은 "오탐"으로 되돌려 <a href="#fp">오탐 신고</a>에서 따로 처리해요</div></div>`:''}
    <div class="scroll mt"><table class="nw"><thead><tr><th>항목</th><th>나간 값</th><th>변환했다면</th><th>직원 처리</th></tr></thead><tbody>
    ${c.items.map(it=>`<tr><td>${it.type}</td>
      <td>${it.status==='conv'?`<span class="muted">${esc(it.conv)||'(삭제)'}</span>`:`<b style="color:var(--text-danger)">${esc(partial(it.type,it.orig))}</b>`}</td>
      <td>${it.conv===''?'<span class="muted">(삭제)</span>':esc(it.conv)}</td>
      <td>${it.status==='conv'?'<span class="pill">변환 유지</span>':it.status==='revert'?`<span class="pill">되돌림 · ${it.reason}</span>`:'<span class="pill bad">원문 전송</span>'}</td></tr>`).join('')}
    </tbody></table></div>

function casePath(c){

    closed?['done','보안팀 결론',CONCLUSION[c.close.k][0]]:[c.reason?'now':'later','보안팀 결론',c.reason?'지금 차례':'사유 도착 후'],

function quickClose(c,k,silent){
  const leaked=c.items.filter(i=>i.status!=='conv'), it=leaked.find(i=>i.reason==='업무상 필요')||leaked[0];
  let rule=null;
  if(k==='legit'&&it){const ty=it.type,cur=ent(ty).method;
    const method=(ty==='이름'&&cur==='대체')?'태그':({태그:'대체',대체:'일반화',일반화:'대체',삭제:'태그'}[cur]||'대체');
    const when=ty==='프로젝트 코드명'?`"${it.orig}"${josa(it.orig,'이','가').slice(it.orig.length)} 포함된 입력`:`${josa(ty,'이','가')} 포함된 ${c.file?'파일':'입력'}`;
    rule=`${when} → ${ty} ${method}`;POLICY.learned.push({type:ty,when,method,from:c.id,hits:0,live:false});change(`자동 변환 추가: ${rule}`,c.id)}
  closeCase(c,{k,cause:k==='fp'?null:k==='legit'?'fit':'care',memo:{violation:'사유 확인 — 위반',legit:'사유 확인 — 업무상 필요',fp:'개인정보 아님'}[k],rule});
  if(!silent)toast(rule?'종결했어요 · 변환 정책에서 배포하면 적용돼요':'종결했어요');

function closeCase(c,res){

// 서버에 붙으면 /logs 데이터로 EVENTS·CASES 를 다시 만들고, 안 붙으면 위 예시 데이터를 그대로 쓴다.
// 서버 주소: 같은 출처 /api(dev_server.py·vercel.json 프록시) → ?api=http://host:port → localStorage(apiBase) → http://localhost:8000 순서로 시도.
const API={base:null,live:false,count:0,stats:null,synced:null};
const TYPE_KO={NAME:'이름',PHONE:'전화번호',EMAIL:'이메일',ADDRESS:'주소',ID_NUMBER:'주민등록번호',ID:'주민등록번호',ACCOUNT:'계좌번호',CARD:'카드번호',DOB:'생년월일',
  USERNAME:'아이디',IP_ADDRESS:'IP 주소',BUSINESS_NUMBER:'사업자번호',API_KEY:'API 키',ACCESS_TOKEN:'액세스 토큰',PASSWORD:'비밀번호'};
const GRADE_IN={public_O:'O',sensitive_S:'S',confidential_C:'C'};
async function apiGet(path,ms=2500){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(API.base+path,{signal:ctl.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}
}
function apiCandidates(){
  const q=new URLSearchParams(location.search).get('api');if(q==='off')return []; // ?api=off: 예시 데이터로만
  let st=null;try{st=localStorage.getItem('apiBase')}catch(e){}
  return ['/api',q,st,'http://localhost:8000'].filter(Boolean).map(u=>u.replace(/\/$/,''));
}
// 서버 이벤트 1건 → 콘솔 이벤트. 서버는 원문·직원·AI를 저장하지 않으므로 그 칸은 비워 둔다.
function fromServer(ev){
  const grade=GRADE_IN[ev.grade]||'O', types=(ev.detected_types||[]).map(t=>TYPE_KO[t]||t);
  types.forEach(t=>{if(!ent(t))POLICY.entities.push({name:t,grade:grade==='C'?'C':'S',method:grade==='C'?'—':'대체',sample:'',on:true})});
  const action=grade==='C'?'block':grade==='O'?'pass':{send_transformed:'sent',send_as_is:'raw',revert_original:'revert',cancel:'cancel'}[ev.action]||'sent';
  const rsn={false_positive:'오탐',business_need:'업무상 필요'}[ev.reason]||null;
  const items=types.map(type=>({type,orig:`⟦${type}⟧`,method:(ent(type)||{}).method||'대체',conv:'(변환됨)',
    status:grade!=='S'?null:action==='raw'?'raw':action==='revert'?'revert':'conv',reason:action==='revert'?rsn:null,fp:action==='revert'&&rsn==='오탐'?'open':null}));
  const h=(ev.content_hash||String(ev.id)).slice(0,4);
  return {id:String(ev.id),time:new Date(ev.created_at),user:`직원 ${h}`,dept:'부서 미전송',ai:'AI 미전송',file:null,
    tpl:items.map((_,i)=>`{${i}}`).join(' · ')+(items.length?' — 본문은 서버에 저장하지 않아요':''),items,grade,action,
    conf:ev.detection_confidence==='high'?0.95:0.6,ver:POLICY.version,server:ev};
}
function rebuildCases(){
  CASES.length=0;
  EVENTS.filter(e=>e.grade==='S'&&(e.action==='raw'||(e.action==='revert'&&e.items.some(i=>i.reason==='업무상 필요')))).forEach(e=>{
    const c={id:'INC-'+e.id,ev:e,need:e.action==='raw'?'req':'opt',time:e.time,user:e.user,dept:e.dept,items:e.items,file:null,
      status:'open',reason:null,history:[],ask:null,close:null,timeline:[]};
    if(c.need==='opt') c.reason={pick:'업무상 필요',text:'(직원이 쓴 사유 글은 아직 서버에 없어요)',at:c.time,when:'전송할 때'};
    CASES.push(c);
  });
}
async function connect(){
  for(const base of apiCandidates()){
    API.base=base;
    try{
      const h=await apiGet('/health');if(h.status!=='ok')continue;
      const start=new Date(Date.now()-7*864e5).toISOString();
      const evs=await apiGet('/logs/events?limit=1000&start='+encodeURIComponent(start),5000);
      NOW=new Date();LOADED=Date.now();
      EVENTS.length=0;evs.map(fromServer).forEach(e=>EVENTS.push(e));EVENTS.sort((a,b)=>b.time-a.time);
      rebuildCases();
      let stats=null;try{stats=await apiGet('/logs/stats')}catch(e){}
      Object.assign(API,{live:true,count:evs.length,stats,synced:new Date()});return true;
    }catch(e){/* 다음 후보 */}
  }
  API.base=null;return false;
}
const QUEUE_KO={real_violation:'실제 위반',violation_candidate:'위반 후보(업무상 필요)',detection_improve:'탐지 개선(오탐)',pre_warning:'사전 경고'};
async function apiPost(path){const r=await fetch(API.base+path,{method:'POST'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.status);return j}
// 연결 상태를 누르면: 서버 주소·전체 통계·다시 불러오기·로그 암호화 내보내기

      <p class="mt" id="expOut">보안팀 공개키로 암호화한 파일을 서버에 만들어요.</p>`
      :`<p>예시 데이터를 보여주고 있어요. tools/dev_server.py 로 열거나 주소 뒤에 ?api=http://서버:포트 를 붙여 주세요.</p>`,
    onOk:async()=>{if(!API.live)return;if(await connect()){route();connBadge();toast(`서버 데이터 ${API.count}건을 다시 불러왔어요`)}else{connBadge();toast('서버에 연결하지 못했어요')}}});
  const b=$('#expBtn');if(b)b.onclick=async()=>{b.disabled=true;$('#expOut').textContent='내보내는 중…';
    try{const r=await apiPost('/logs/export');$('#expOut').innerHTML=`${r.exported}건을 내보냈어요 · 키 지문 <code>${esc(String(r.public_key_fingerprint).slice(0,16))}…</code>`}
    catch(e){$('#expOut').textContent='내보내지 못했어요: '+e.message}finally{b.disabled=false}};
}
function connBadge(){
  const el=$('#conn');if(!el)return;el.onclick=serverPanel;el.setAttribute('role','button');el.tabIndex=0;
  el.className='conn '+(API.live?'on':'off');
  el.textContent=API.live?`서버 연결됨 · ${API.count}건`:'예시 데이터';
  el.title=API.live?`${API.base} · 최근 7일 /logs/events`:'서버에 연결하지 못해 예시 데이터를 보여줘요. 주소 뒤에 ?api=http://서버:포트 를 붙이면 그 서버로 연결해요';
}
async function boot(){
  route();connBadge();
  if(await connect()){route();connBadge();toast(`서버 데이터 ${API.count}건을 불러왔어요`)}
}

boot();
</script>
</body>
</html>
